<style>
:root{box-sizing:border-box;--bg:#eef2f5;--card:#fff;--tx:#0d2230;--mu:#546873;--ac:#21518f;--ac2:#429698;--onac:#fff;--bd:#d3dde3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1418;--card:#12232a;--tx:#eaf3f4;--mu:#8fa8ae;--ac:#429698;--ac2:#429698;--onac:#00181b;--bd:#233a42}}
:root[data-theme="dark"]{--bg:#0a1418;--card:#12232a;--tx:#eaf3f4;--mu:#8fa8ae;--ac:#429698;--ac2:#429698;--onac:#00181b;--bd:#233a42}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:26px;margin:6px 0 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:18px 0 8px}
.top{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ac);color:var(--onac);font:700 17px inherit;font-family:inherit;margin-bottom:10px;padding:10px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{min-height:44px;width:auto;display:inline-block;padding:8px 14px;font-size:15px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{min-height:56px;cursor:pointer}
.mu{color:var(--mu);font-size:14px}
input,select{width:100%;min-height:52px;font:600 20px inherit;font-family:inherit;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--tx)}
input.t,select.t{font-size:16px;font-weight:500}
label{font-size:13px;color:var(--mu);display:block;margin:0 0 4px}
.g3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sug{border-left:5px solid var(--ac2)}.brand{background:#000;padding:10px 14px calc(10px);border-bottom:3px solid var(--ac2);text-align:center}.brand img{height:54px;max-width:100%}h1{border-left:5px solid var(--ac2);padding-left:10px}
.sug b{font-size:18px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}

<script>
const K='efs_v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{clients:[],sets:[],cfg:{incUp:2,incLow:2.5,rpeMax:8},exercises:[
 {id:'e1',n:'Sentadilla trasera',g:'Piernas',t:'inf'},{id:'e2',n:'Peso muerto rumano',g:'Femorales',t:'inf'},
 {id:'e3',n:'Press banca',g:'Pecho',t:'sup'},{id:'e4',n:'Remo con barra',g:'Espalda',t:'sup'},
 {id:'e5',n:'Press militar',g:'Hombro',t:'sup'},{id:'e6',n:'Dominadas',g:'Espalda',t:'sup'}]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const df=d=>d.slice(8)+'/'+d.slice(5,7);
const e1rm=(w,r)=>w*(1+r/30); /* Epley */
const ex=id=>S.exercises.find(x=>x.id===id)||{n:'?'};
const cl=id=>S.clients.find(x=>x.id===id)||{name:'?'};
let view={v:'home'},stack=[];
const go=v=>{stack.push(view);view=v;render()};

function lastSession(c,e){
 const xs=S.sets.filter(s=>s.c===c&&s.e===e&&s.d<today());
 if(!xs.length)return null;
 const d=xs.map(s=>s.d).sort().pop();
 return xs.filter(s=>s.d===d).sort((a,b)=>a.n-b.n);
}
function sug(c,e){
 const L=lastSession(c,e);if(!L)return null;
 const inc=ex(e).t==='inf'?S.cfg.incLow:S.cfg.incUp;
 const w=Math.max(...L.map(s=>s.w)),tr=L[0].r,ok=L.every(s=>s.r>=tr),rpe=Math.max(...L.map(s=>s.rpe||0));
 const last=L.map(s=>fmt(s.w)+'×'+s.r).join(' · ')+(rpe?' · RPE '+rpe:'');
 if(ok&&rpe<=S.cfg.rpeMax)return{w:w+inc,last,t:'Puedes probar '+fmt(w+inc)+' kg manteniendo '+tr+' repeticiones.'};
 if(ok)return{w,last,t:'Mantén '+fmt(w)+' kg hasta bajar el RPE a '+S.cfg.rpeMax+' o menos.'};
 return{w,last,t:'Mantén '+fmt(w)+' kg e intenta completar '+L.length+' series de '+tr+' antes de subir (o baja peso si no sale).'};
}
function chart(pts){
 if(pts.length<2)return'<p class="mu">La gráfica aparece con 2 sesiones o más.</p>';
 const W=320,H=120,p=14,ws=pts.map(x=>x.w),mn=Math.min(...ws),mx=Math.max(...ws),rg=(mx-mn)||1;
 const xy=pts.map((x,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-((x.w-mn)/rg)*(H-2*p)]);
 return'<svg viewBox="0 0 '+W+' '+H+'" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="'+xy.map(a=>a.join(',')).join(' ')+'"/>'+xy.map(a=>'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="var(--ac)"/>').join('')+'</svg>';
}
function bestByDate(c,e){
 const m={};
 S.sets.filter(s=>s.c===c&&s.e===e).forEach(s=>{const b=m[s.d];if(!b||s.w>b.w||(s.w===b.w&&s.r>b.r))m[s.d]={d:s.d,w:s.w,r:s.r,rpe:s.rpe}});
 return Object.values(m).sort((a,b)=>a.d<b.d?-1:1);
}

const V={
 home(){
  return'<h1>Clientes</h1>'+(S.clients.filter(c=>c.st!=='off').map(c=>'<div class="card item row" data-a="cli" data-i="'+c.id+'"><div><b>'+esc(c.name)+'</b><div class="mu">'+esc(c.lvl)+'</div></div><span class="mu">›</span></div>').join('')||'<p class="mu">Aún no hay clientes. Crea el primero abajo.</p>')+
  '<div class="card"><label>Nombre</label><input class="t" id="cn" placeholder="Nombre del cliente"><div style="height:8px"></div><label>Nivel</label><select class="t" id="cl"><option>principiante</option><option>intermedio</option><option>avanzado</option></select></div>'+
  '<button class="btn" data-a="addC">+ Nuevo cliente</button><div class="grid"><button class="btn alt" data-a="exs">Ejercicios</button><button class="btn alt" data-a="cfg">Progresión</button></div>';
 },
 cli(){
  const c=cl(view.c);
  return'<h1>'+esc(c.name)+'</h1><button class="btn" data-a="ses">Nueva sesión</button><div class="grid"><button class="btn alt" data-a="hist">Historial</button><button class="btn alt" data-a="prog">Progreso</button></div><button class="btn alt" data-a="tab">Tabla completa</button><button class="btn alt" data-a="edit">Editar o eliminar cliente</button>';
 },
 edit(){
  const c=cl(view.c);
  return'<h1>Editar cliente</h1><div class="card"><label>Nombre</label><input class="t" id="en2" value="'+esc(c.name)+'"><div style="height:8px"></div><label>Nivel</label><select class="t" id="el2">'+['principiante','intermedio','avanzado'].map(x=>'<option'+(x===c.lvl?' selected':'')+'>'+x+'</option>').join('')+'</select></div><button class="btn" data-a="saveC">Guardar cambios</button><button class="btn alt" data-a="delC" style="color:#c0392b">'+(view.cf?'Toca de nuevo para eliminar (se borra todo su historial)':'Eliminar cliente')+'</button>';
 },
 ses(){
  const c=view.c,e=view.e||S.exercises[0].id,sg=sug(c,e),t=today();
  const mine=S.sets.filter(s=>s.c===c&&s.e===e&&s.d===t).sort((a,b)=>a.n-b.n);
  const w=view.w!=null?view.w:(sg?sg.w:(mine.length?mine[mine.length-1].w:''));
  const r=view.r!=null?view.r:(mine.length?mine[mine.length-1].r:'');
  return'<h1>Sesión · '+esc(cl(c).name)+'</h1><label>Ejercicio</label><select id="sel">'+S.exercises.map(x=>'<option value="'+x.id+'"'+(x.id===e?' selected':'')+'>'+esc(x.n)+'</option>').join('')+'</select><div style="height:10px"></div>'+
  (sg?'<div class="card sug"><div class="mu">Última sesión: '+esc(sg.last)+'</div><b>'+esc(sg.t)+'</b><div class="mu">Es solo una sugerencia: cambia el peso como prefieras.</div></div>':'<p class="mu">Sin historial para este ejercicio todavía.</p>')+
  '<div class="g3"><div><label>Peso (kg)</label><input id="w" type="number" inputmode="decimal" step="0.5" value="'+esc(w)+'"></div><div><label>Reps</label><input id="r" type="number" inputmode="numeric" value="'+esc(r)+'"></div><div><label>RPE</label><select id="rpe"><option value="">–</option>'+[10,9.5,9,8.5,8,7,6].map(x=>'<option'+(view.rpe==x?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+
  '<div class="card"><label>¿Otro ejercicio? Escríbelo y se crea al momento</label><input class="t" id="qn" placeholder="Ej: Hip thrust, Face pull, Plancha…"><div style="height:8px"></div><div class="row" style="gap:8px"><select class="t" id="qt"><option value="sup">Superior</option><option value="inf">Inferior</option></select><button class="btn sm" data-a="quick" style="white-space:nowrap">+ Añadir</button></div></div><label>Observación</label><input class="t" id="nt" placeholder="Opcional" style="margin-bottom:10px"><button class="btn" data-a="saveSet">Guardar serie '+(mine.length+1)+'</button>'+
  mine.map(s=>'<div class="card row"><span><b>Serie '+s.n+'</b> · '+fmt(s.w)+' kg × '+s.r+(s.rpe?' · RPE '+s.rpe:'')+(s.nt?'<div class="mu">'+esc(s.nt)+'</div>':'')+'</span><button class="x" data-a="del" data-i="'+s.id+'">✕</button></div>').join('');
 },
 hist(){
  const xs=S.sets.filter(s=>s.c===view.c),ds=[...new Set(xs.map(s=>s.d))].sort().reverse();
  return'<h1>Historial</h1>'+(ds.map(d=>'<h2>'+df(d)+'</h2>'+[...new Set(xs.filter(s=>s.d===d).map(s=>s.e))].map(e=>'<div class="card"><b>'+esc(ex(e).n)+'</b><div class="mu">'+xs.filter(s=>s.d===d&&s.e===e).sort((a,b)=>a.n-b.n).map(s=>fmt(s.w)+'×'+s.r+(s.rpe?' @'+s.rpe:'')).join(' · ')+'</div></div>').join('')).join('')||'<p class="mu">Todavía no hay sesiones guardadas.</p>');
 },
 prog(){
  const es=[...new Set(S.sets.filter(s=>s.c===view.c).map(s=>s.e))];
  if(!view.pe)return'<h1>Progreso</h1>'+(es.map(e=>{const b=bestByDate(view.c,e),m=b[b.length-1];return'<div class="card item row" data-a="pe" data-i="'+e+'"><div><b>'+esc(ex(e).n)+'</b><div class="mu">Última: '+df(m.d)+' · '+fmt(m.w)+' kg × '+m.r+'</div></div><span class="mu">›</span></div>'}).join('')||'<p class="mu">Registra una sesión para ver el progreso.</p>');
  const b=bestByDate(view.c,view.pe),top=b.reduce((a,x)=>x.w>a.w?x:a,b[0]),est=Math.max(...b.map(x=>e1rm(x.w,x.r)));
  return'<h1>'+esc(ex(view.pe).n)+'</h1><div class="card">'+chart(b)+'</div><div class="card"><b>Mejor marca:</b> '+fmt(top.w)+' kg × '+top.r+'<br><b>1RM estimado:</b> ≈ '+fmt(est)+' kg <span class="mu">(referencia, fórmula de Epley)</span></div>'+b.slice().reverse().map(x=>'<div class="card row"><span>'+df(x.d)+' → <b>'+fmt(x.w)+' kg × '+x.r+'</b></span><span class="mu">'+(x.rpe?'RPE '+x.rpe:'')+'</span></div>').join('');
 },
 tab(){
  const xs=S.sets.filter(s=>s.c===view.c).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:a.n-b.n);
  return'<h1>Tabla</h1><div class="wrap"><table><tr><th>Fecha</th><th>Cliente</th><th>Ejercicio</th><th>Serie</th><th>Peso</th><th>Reps</th><th>RPE</th><th>RIR</th><th>Volumen</th><th>Obs.</th></tr>'+
  xs.map(s=>'<tr><td>'+df(s.d)+'</td><td>'+esc(cl(s.c).name)+'</td><td>'+esc(ex(s.e).n)+'</td><td>'+s.n+'</td><td>'+fmt(s.w)+'</td><td>'+s.r+'</td><td>'+(s.rpe||'')+'</td><td>'+(s.rpe?fmt(10-s.rpe):'')+'</td><td>'+fmt(s.w*s.r)+'</td><td>'+esc(s.nt||'')+'</td></tr>').join('')+'</table></div>';
 },
 exs(){
  return'<h1>Ejercicios</h1><div class="card"><input class="t" id="s" placeholder="Buscar ejercicio" oninput="filt()"></div><div id="lst">'+lst('')+'</div>'+
  '<h2>Nuevo ejercicio</h2><div class="card"><label>Nombre</label><input class="t" id="en"><div style="height:8px"></div><label>Grupo muscular</label><input class="t" id="eg"><div style="height:8px"></div><label>Categoría / equipamiento / notas (libre)</label><input class="t" id="ed" placeholder="Fuerza, mancuernas, técnica…"><div style="height:8px"></div><label>Tipo (define el incremento de peso)</label><select class="t" id="et"><option value="sup">Tren superior</option><option value="inf">Tren inferior</option></select></div><button class="btn" data-a="addE">Guardar ejercicio</button>';
 },
 cfg(){
  return'<h1>Progresión</h1><div class="card"><label>Incremento tren superior (kg)</label><input id="c1" type="number" inputmode="decimal" step="0.5" value="'+S.cfg.incUp+'" onchange="setCfg()"><div style="height:10px"></div><label>Incremento tren inferior (kg)</label><input id="c2" type="number" inputmode="decimal" step="0.5" value="'+S.cfg.incLow+'" onchange="setCfg()"><div style="height:10px"></div><label>Subir peso si completa todo con RPE igual o menor a</label><input id="c3" type="number" inputmode="decimal" step="0.5" value="'+S.cfg.rpeMax+'" onchange="setCfg()"></div><p class="mu">Si completa las series con RPE 9 o 10, sugiere mantener. Si no completa las repeticiones, sugiere mantener o bajar.</p>';
 }
};
function lst(q){q=q.toLowerCase();return S.exercises.filter(x=>x.n.toLowerCase().includes(q)||(x.g||'').toLowerCase().includes(q)).map(x=>'<div class="card row"><span><b>'+esc(x.n)+'</b><div class="mu">'+esc(x.g)+' · '+(x.t==='inf'?'inferior':'superior')+(x.d?' · '+esc(x.d):'')+'</div></span><button class="x" data-a="delE" data-i="'+x.id+'">✕</button></div>').join('')}
function filt(){$('lst').innerHTML=lst($('s').value)}
function setCfg(){const a=parseFloat($('c1').value),b=parseFloat($('c2').value),c=parseFloat($('c3').value);if(a>0)S.cfg.incUp=a;if(b>0)S.cfg.incLow=b;if(c>0)S.cfg.rpeMax=c;save()}
function render(){$('app').innerHTML=(stack.length?'<div class="top"><button class="back" data-a="back">‹ Atrás</button></div>':'')+V[view.v]();window.scrollTo(0,0)}
function rerender(){const y=window.scrollY;$('app').innerHTML=(stack.length?'<div class="top"><button class="back" data-a="back">‹ Atrás</button></div>':'')+V[view.v]();window.scrollTo(0,y)}
const A={
 back(){view=stack.pop()||{v:'home'};if(!stack.length&&view.v==='home')stack=[];render()},
 cli(i){go({v:'cli',c:i})},
 addC(){const n=$('cn').value.trim();if(!n)return;S.clients.push({id:uid(),name:n,lvl:$('cl').value,st:'on',d:today()});save();render()},
 ses(){go({v:'ses',c:view.c})},hist(){go({v:'hist',c:view.c})},prog(){go({v:'prog',c:view.c})},tab(){go({v:'tab',c:view.c})},
 pe(i){view.pe=i;stack.push({v:'prog',c:view.c});render()},
 exs(){go({v:'exs'})},cfg(){go({v:'cfg'})},
 saveSet(){
  const w=parseFloat($('w').value),r=parseInt($('r').value,10),rp=parseFloat($('rpe').value)||0;
  if(!(w>=0)||!(r>0))return;
  const c=view.c,e=$('sel').value,n=S.sets.filter(s=>s.c===c&&s.e===e&&s.d===today()).length+1;
  S.sets.push({id:uid(),c,e,d:today(),n,w,r,rpe:rp,nt:$('nt').value.trim()});
  view.e=e;view.w=w;view.r=r;view.rpe=rp||null;save();rerender();
 },
 del(i){S.sets=S.sets.filter(s=>s.id!==i);save();rerender()},
 quick(){const n=$('qn').value.trim();if(!n)return;let x=S.exercises.find(y=>y.n.toLowerCase()===n.toLowerCase());if(!x){x={id:uid(),n,g:'',t:$('qt').value};S.exercises.push(x)}view.e=x.id;view.w=null;view.r=null;save();rerender()},
 edit(){go({v:'edit',c:view.c})},
 saveC(){const n=$('en2').value.trim();if(!n)return;const c=cl(view.c);c.name=n;c.lvl=$('el2').value;save();A.back();rerender()},
 delC(){if(!view.cf){view.cf=1;rerender();return}S.sets=S.sets.filter(s=>s.c!==view.c);S.clients=S.clients.filter(x=>x.id!==view.c);save();stack=[];view={v:'home'};render()},
 addE(){const n=$('en').value.trim();if(!n)return;S.exercises.push({id:uid(),n,g:$('eg').value.trim(),d:$('ed').value.trim(),t:$('et').value});save();rerender()},
 delE(i){if(S.sets.some(s=>s.e===i))return;S.exercises=S.exercises.filter(x=>x.id!==i);save();rerender()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
document.addEventListener('change',e=>{if(e.target.id==='sel'){view.e=e.target.value;view.w=null;view.r=null;rerender()}});
render();
</script></body></html>
